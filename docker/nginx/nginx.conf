upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# --- HTTP: ACME challenge と HTTPS リダイレクトのみ ---
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge (no auth — ACME server needs access)
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    # 302 (恒久ではない) にしている。301 はブラウザに恒久キャッシュされるため、
    # 160時間証明書の更新に失敗して HTTPS が落ちた時に HTTP へ戻れなくなる。
    # HSTS を付けない判断(下記)と同じ理由。
    location / {
        return 302 https://$host$request_uri;
    }
}

# --- HTTPS ---
# 証明書は Let's Encrypt の IPアドレス証明書(shortlived プロファイル / 有効期間160時間)。
# 更新は deploy/certbot-renew.sh を systemd timer が8時間ごとに実行する。
#
# HSTS は付けない: RFC 6797 8.1.1 により UA は Host が IPリテラルの場合 HSTS を記録しないため
# IP直アクセスでは効果がゼロで、更新失敗時に回復不能になる副作用だけが残る。
# 独自ドメインを導入したら再検討する。
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/kbar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kbar/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    # 既定の HIGH:!aNULL:!MD5 には TLS1.2 の静的RSA鍵交換(前方秘匿性なし)や
    # CBC-SHA1 が含まれる。prefer_server_ciphers off でクライアントに選択権が
    # あるため、PFS のあるスイートだけに絞る。TLS1.3 はこの指定の影響を受けない。
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # セッションチケット鍵は起動/reload 時に生成され稼働中はローテートしない。
    # 1d のままだと鍵漏洩時に再開セッションをまとめて復号される余地が広いので短くする。
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Basic auth (self-only access)
    auth_basic "K-Bar AI";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # LINE Webhook (no auth — LINE servers need access)
    # 無認証で uvicorn (UVICORN_WORKERS=1) に到達できる唯一の経路なので、
    # 本文サイズと流量を絞る。LINE の正常流量はこれを大きく下回る。
    location = /api/v1/notifications/webhook {
        auth_basic off;
        client_max_body_size 256k;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (with auth)
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 穴馬検索などライブスクレイプを伴うAPIがあるため長め
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Frontend (with auth)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
