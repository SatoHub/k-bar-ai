# 🔴 upstream ブロックは使わない（BUG-004・2026-09-27 に本番が全ページ502）
#
# `upstream { server backend:8000; }` は**設定読み込み時に1度だけ**名前解決し、
# その IP を保持し続ける（`server ... resolve;` は nginx Plus 限定の機能）。
# 自動デプロイは backend / frontend を作り直すが nginx は再起動しないため、
# コンテナの IP が変わると古い IP に送り続ける。実際に backend と frontend の
# IP がちょうど入れ替わり、API が frontend に、画面が backend に飛んで
# 両方 502 になった。IP が偶然同じ値で再割当されると何も起きないので、
# **発覚するかどうかは運任せ**だった。
#
# 対策: Docker 内蔵 DNS を resolver に指定し、**変数経由**で proxy_pass する。
# proxy_pass に変数を含めると nginx は**リクエストごとに**名前解決する。
# 詳細 = docs/20260228-bug-registry.md の BUG-004
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# --- HTTP: ACME challenge と HTTPS リダイレクトのみ ---
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge (no auth — ACME server needs access)
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    # 302 (恒久ではない) にしている。301 はブラウザに恒久キャッシュされるため、
    # 160時間証明書の更新に失敗して HTTPS が落ちた時に HTTP へ戻れなくなる。
    # HSTS を付けない判断(下記)と同じ理由。
    location / {
        return 302 https://$host$request_uri;
    }
}

# --- HTTPS ---
# 証明書は Let's Encrypt の IPアドレス証明書(shortlived プロファイル / 有効期間160時間)。
# 更新は deploy/certbot-renew.sh を systemd timer が8時間ごとに実行する。
#
# HSTS は付けない: RFC 6797 8.1.1 により UA は Host が IPリテラルの場合 HSTS を記録しないため
# IP直アクセスでは効果がゼロで、更新失敗時に回復不能になる副作用だけが残る。
# 独自ドメインを導入したら再検討する。
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/kbar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kbar/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    # 既定の HIGH:!aNULL:!MD5 には TLS1.2 の静的RSA鍵交換(前方秘匿性なし)や
    # CBC-SHA1 が含まれる。prefer_server_ciphers off でクライアントに選択権が
    # あるため、PFS のあるスイートだけに絞る。TLS1.3 はこの指定の影響を受けない。
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # セッションチケット鍵は起動/reload 時に生成され稼働中はローテートしない。
    # 1d のままだと鍵漏洩時に再開セッションをまとめて復号される余地が広いので短くする。
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Basic auth (self-only access)
    auth_basic "K-Bar AI";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # LINE Webhook (no auth — LINE servers need access)
    # 無認証で uvicorn (UVICORN_WORKERS=1) に到達できる唯一の経路なので、
    # 本文サイズと流量を絞る。LINE の正常流量はこれを大きく下回る。
    location = /api/v1/notifications/webhook {
        auth_basic off;
        client_max_body_size 256k;
        # 変数経由にすることでリクエストごとに名前解決される（BUG-004）
        set $backend_up "backend:8000";
        proxy_pass http://$backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (with auth)
    location /api/ {
        # 変数経由にすることでリクエストごとに名前解決される（BUG-004）
        set $backend_up "backend:8000";
        proxy_pass http://$backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 穴馬検索などライブスクレイプを伴うAPIがあるため長め
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Frontend (with auth)
    location / {
        # 変数経由にすることでリクエストごとに名前解決される（BUG-004）
        set $frontend_up "frontend:3000";
        proxy_pass http://$frontend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
