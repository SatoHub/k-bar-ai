# =============================================================
# ブートストラップ専用の nginx 設定（HTTP のみ・TLS なし）
#
# なぜ必要か:
#   nginx は ssl_certificate のファイルが存在しないと起動時に致命的エラーで終了する。
#   新規/再構築した VPS では certbot-certs ボリュームが空なので、
#   本番設定(nginx.conf)のまま `up -d` すると
#     nginx が起動しない → 80番が応答しない → HTTP-01 challenge が通らない
#     → 証明書が取れない → nginx が起動しない
#   というデッドロックに陥る。
#
# 使い方（詳細は docs/20260916-https-ip-certificate.md）:
#   1) NGINX_CONF=./nginx/nginx.bootstrap.conf を .env に設定して nginx を起動
#   2) certbot で証明書を取得
#   3) .env から NGINX_CONF を消して nginx を再作成（本番設定に戻る）
# =============================================================

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    auth_basic "K-Bar AI";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Let's Encrypt HTTP-01 challenge (no auth)
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location = /api/v1/notifications/webhook {
        auth_basic off;
        client_max_body_size 256k;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
