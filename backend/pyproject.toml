[project]
name = "k-bar-ai-backend"
version = "0.1.0"
description = "K-Bar AI - Horse Racing Prediction Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.129.0",
    "joblib>=1.4.0",
    "lightgbm>=4.5.0",
    "pandas>=3.0.1",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.13.0",
    "scikit-learn>=1.6.0",
    "shap>=0.46.0",
    "sqlalchemy[asyncio]>=2.0.46",
    "typer>=0.24.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
